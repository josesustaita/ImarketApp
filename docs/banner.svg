<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">IMARKET — good finds. fresh starts.</title>
  <desc id="desc">
    Animated project nameplate. MARKETPLACE / MOBILE / WEB. Artwork is
    decorative and respects reduced-motion preferences.
  </desc>
  <style>
    .bob,
    .cloud {
      animation: float 3s ease-in-out infinite;
    }
    .tail {
      animation: twinkle 2s ease-in-out infinite;
    }
    .twinkle,
    .blink {
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .orbit {
      transform-origin: 146px 109px;
      animation: orbit 35s linear infinite;
    }
    .pulse {
      animation: twinkle 2s ease-in-out infinite;
    }
    .bar {
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
    @keyframes twinkle {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }
    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
  <rect width="1200" height="300" rx="18" fill="#111d1a" />
  <rect
    x="14"
    y="14"
    width="1172"
    height="272"
    rx="10"
    fill="none"
    stroke="#3b4b40"
  />
  <circle cx="58" cy="56" r="5" fill="#f4a777" />
  <g font-family="ui-monospace,monospace">
    <text x="76" y="61" font-size="13" letter-spacing="3" fill="#f4a777">
      JOSE SUSTAITA / THE WORKBENCH
    </text>
    <text
      x="54"
      y="145"
      font-size="53"
      font-weight="700"
      letter-spacing="-2"
      fill="#f5f1e6"
    >
      IMARKET
    </text>
    <text x="58" y="191" font-size="20" fill="#bbc8bb">
      good finds. fresh starts.
    </text>
    <path d="M58 221h680" stroke="#3b4b40" />
    <text x="58" y="255" font-size="13" letter-spacing="2" fill="#f4a777">
      MARKETPLACE / MOBILE / WEB
    </text>
  </g>
  <g transform="translate(840 26)">
    <g
      class="bob"
      fill="none"
      stroke="#f4a777"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M32 60h28l25 105h130l28-80H68M85 165l-8 24h148M105 85v68m48-68v68m46-68v68M77 120h151"
      />
      <circle cx="99" cy="211" r="11" />
      <circle cx="205" cy="211" r="11" />
      <path class="twinkle" d="M166 15v30m-15-15h30m63-12v20m-10-10h20" />
    </g>
  </g>
</svg>
